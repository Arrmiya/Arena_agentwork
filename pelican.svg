<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Sky & Sea Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="55%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Pelican Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="beakUpperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="legGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Sun -->
  <circle cx="680" cy="110" r="52" fill="#fde047" opacity="0.85" />
  <circle cx="680" cy="110" r="68" fill="#fef08a" opacity="0.35" />

  <!-- Soft Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <path d="M 110 120 Q 110 95 135 95 Q 150 75 180 85 Q 205 75 220 95 Q 245 98 245 120 Z" />
    <path d="M 480 80 Q 480 62 500 62 Q 515 48 538 55 Q 558 50 568 65 Q 585 68 585 80 Z" />
  </g>

  <!-- Distant Seagulls -->
  <g fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round">
    <path d="M 290 130 Q 300 120 310 130 Q 320 120 330 130" />
    <path d="M 350 110 Q 357 103 364 110 Q 371 103 378 110" />
  </g>

  <!-- Distant Ocean & Horizon -->
  <rect x="0" y="420" width="800" height="55" fill="url(#seaGrad)" />
  <path d="M 40 440 Q 65 435 90 440 M 220 450 Q 250 444 280 450 M 600 438 Q 630 433 660 438" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round" />

  <!-- Boardwalk / Coastal Road -->
  <rect x="0" y="470" width="800" height="15" fill="#d97706" />
  <rect x="0" y="485" width="800" height="115" fill="url(#roadGrad)" />
  <!-- Road Dashed Line -->
  <line x1="0" y1="540" x2="800" y2="540" stroke="#facc15" stroke-width="6" stroke-dasharray="45 35" stroke-linecap="round" opacity="0.85" />

  <!-- Ground Shadow under Bicycle -->
  <ellipse cx="400" cy="522" rx="225" ry="14" fill="#0f172a" opacity="0.28" />

  <!-- Speed / Breeze Lines -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <line x1="65" y1="260" x2="145" y2="260" />
    <line x1="45" y1="330" x2="115" y2="330" />
    <line x1="80" y1="435" x2="140" y2="435" />
  </g>

  <!-- ================= FAR LEG (Behind Frame) ================= -->
  <g id="far-leg">
    <!-- Upper Thigh to Knee (330,305) -> (338,385) -->
    <path d="M 330 305 L 338 385" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round" />
    <!-- Lower Leg (338,385) -> Lower Pedal (360,475) -->
    <path d="M 338 385 L 360 472" stroke="#d97706" stroke-width="10" stroke-linecap="round" />
    <circle cx="338" cy="385" r="7" fill="#d97706" />
    <!-- Far Webbed Foot on Lower Pedal -->
    <path d="M 352 472 L 395 476 C 398 468 385 462 365 466 Z" fill="#d97706" />
    <!-- Far Pedal -->
    <rect x="344" y="473" width="36" height="8" rx="4" fill="#1e293b" />
    <!-- Rear Crank Arm -->
    <line x1="390" y1="430" x2="360" y2="475" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  </g>

  <!-- ================= BICYCLE ================= -->
  <!-- Rear Wheel (center: 250, 430, r=82) -->
  <g id="rear-wheel" transform="translate(250, 430)">
    <!-- Spokes -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="-76" y1="0" x2="76" y2="0" />
      <line x1="0" y1="-76" x2="0" y2="76" />
      <line x1="-54" y1="-54" x2="54" y2="54" />
      <line x1="-54" y1="54" x2="54" y2="-54" />
      <line x1="-66" y1="-38" x2="66" y2="38" />
      <line x1="-38" y1="-66" x2="38" y2="66" />
      <line x1="-66" y1="38" x2="66" y2="-38" />
      <line x1="-38" y1="66" x2="38" y2="-66" />
    </g>
    <!-- Tire & Rim -->
    <circle r="82" fill="none" stroke="#1e293b" stroke-width="14" />
    <circle r="73" fill="none" stroke="#fef3c7" stroke-width="4" />
    <circle r="69" fill="none" stroke="#94a3b8" stroke-width="3" />
    <!-- Rear Cog -->
    <circle r="16" fill="#475569" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="5 3" />
  </g>

  <!-- Front Wheel (center: 545, 430, r=82) -->
  <g id="front-wheel" transform="translate(545, 430)">
    <!-- Spokes -->
    <g stroke="#cbd5e1" stroke-width="2">
      <line x1="-76" y1="0" x2="76" y2="0" />
      <line x1="0" y1="-76" x2="0" y2="76" />
      <line x1="-54" y1="-54" x2="54" y2="54" />
      <line x1="-54" y1="54" x2="54" y2="-54" />
      <line x1="-66" y1="-38" x2="66" y2="38" />
      <line x1="-38" y1="-66" x2="38" y2="66" />
      <line x1="-66" y1="38" x2="66" y2="-38" />
      <line x1="-38" y1="66" x2="38" y2="-66" />
    </g>
    <!-- Tire & Rim -->
    <circle r="82" fill="none" stroke="#1e293b" stroke-width="14" />
    <circle r="73" fill="none" stroke="#fef3c7" stroke-width="4" />
    <circle r="69" fill="none" stroke="#94a3b8" stroke-width="3" />
    <!-- Hub -->
    <circle r="10" fill="#64748b" stroke="#e2e8f0" stroke-width="3" />
  </g>

  <!-- Rear Fender -->
  <path d="M 155 415 A 95 95 0 0 1 325 370" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" />
  <!-- Front Fender -->
  <path d="M 465 375 A 95 95 0 0 1 625 385" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" />

  <!-- Chain -->
  <path d="M 250 415 L 390 404 A 26 26 0 0 1 390 456 L 250 445 A 15 15 0 0 1 250 415 Z" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="6 4" />

  <!-- Seatpost & Handlebar Stem (Silver) -->
  <line x1="342" y1="305" x2="332" y2="265" stroke="#94a3b8" stroke-width="9" stroke-linecap="round" />
  <path d="M 490 290 L 478 240 Q 474 225 455 230 L 435 236" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bicycle Diamond Frame -->
  <g stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#softShadow)">
    <!-- Chainstay: Rear hub (250,430) to Bottom Bracket (390,430) -->
    <line x1="250" y1="430" x2="390" y2="430" stroke-width="10" />
    <!-- Seatstay: Rear hub (250,430) to Seat cluster (342,305) -->
    <line x1="250" y1="430" x2="342" y2="305" stroke-width="9" />
    <!-- Seat tube: Bottom Bracket (390,430) to Seat cluster (342,305) -->
    <line x1="390" y1="430" x2="342" y2="305" />
    <!-- Down tube: Bottom Bracket (390,430) to Head tube lower (498,325) -->
    <line x1="390" y1="430" x2="498" y2="325" />
    <!-- Top tube: Seat cluster (342,305) to Head tube upper (490,295) -->
    <path d="M 342 305 Q 415 305 490 295" />
    <!-- Head tube -->
    <line x1="488" y1="286" x2="500" y2="334" stroke-width="14" />
    <!-- Front Fork: Head tube lower (498,328) to Front hub (545,430) -->
    <path d="M 498 328 Q 515 385 545 430" stroke-width="10" />
  </g>

  <!-- Rear Hub Cap -->
  <circle cx="250" cy="430" r="9" fill="#e2e8f0" stroke="#475569" stroke-width="3" />

  <!-- Crankset / Chainring (center: 390, 430) -->
  <g transform="translate(390, 430)">
    <circle r="26" fill="#e2e8f0" stroke="#64748b" stroke-width="5" />
    <circle r="18" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 6" />
    <circle r="7" fill="#475569" />
  </g>

  <!-- Front Basket on Handlebars (with a Fish!) -->
  <g transform="translate(498, 246) rotate(8)">
    <!-- Fish Tail Poking Out of Basket -->
    <path d="M 28 2 C 35 -18 52 -22 50 -5 C 48 5 35 10 25 10 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <path d="M 48 -8 L 62 -18 L 57 -3 L 64 6 L 47 0 Z" fill="#0284c7" />
    <!-- Wicker Basket -->
    <rect x="0" y="0" width="52" height="42" rx="6" fill="#d97706" stroke="#92400e" stroke-width="3" />
    <line x1="0" y1="14" x2="52" y2="14" stroke="#92400e" stroke-width="2" />
    <line x1="0" y1="28" x2="52" y2="28" stroke="#92400e" stroke-width="2" />
    <line x1="17" y1="0" x2="17" y2="42" stroke="#92400e" stroke-width="2" />
    <line x1="35" y1="0" x2="35" y2="42" stroke="#92400e" stroke-width="2" />
    <rect x="-3" y="-4" width="58" height="8" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2" />
  </g>

  <!-- Leather Saddle -->
  <path d="M 300 265 Q 325 250 368 262 Q 375 270 355 275 Q 325 276 304 278 Q 292 275 300 265 Z" fill="#78350f" stroke="#451a03" stroke-width="3" />

  <!-- ================= PELICAN ================= -->
  <g id="pelican" filter="url(#softShadow)">
    <!-- Tail Feathers -->
    <path d="M 265 268 L 222 252 L 236 270 L 218 280 L 240 288 L 228 300 L 272 295 Z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Plump Body -->
    <path d="M 265 275 C 260 220 330 195 395 215 C 435 228 448 270 420 302 C 392 332 325 330 285 305 C 270 296 266 286 265 275 Z" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="3" />

    <!-- Graceful S-Curved Neck -->
    <path d="M 378 232 C 392 195 385 150 400 118 C 410 96 435 90 452 104 C 462 115 452 145 438 175 C 425 205 430 238 415 262 Z" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="3" />

    <!-- Head & Pert Crest Feathers -->
    <path d="M 398 112 L 372 96 L 388 116 L 368 112 L 388 126 L 375 128 L 400 135 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="430" cy="115" r="32" fill="url(#bodyGrad)" stroke="#94a3b8" stroke-width="3" />

    <!-- Iconic Giant Gular Pouch (Throat Sack) -->
    <path d="M 452 122 C 455 198 515 222 568 188 C 602 166 612 140 612 126 Z" fill="url(#pouchGrad)" stroke="#c2410c" stroke-width="3" stroke-linejoin="round" />
    <!-- Pouch Texture Folds -->
    <path d="M 468 138 Q 515 182 588 134" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.65" />
    <path d="M 480 156 Q 525 195 575 152" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.5" />

    <!-- Long Upper Mandible (Beak) with Hooked Tip -->
    <path d="M 450 96 L 614 114 C 625 116 628 128 620 136 C 615 140 609 135 608 128 L 448 124 Z" fill="url(#beakUpperGrad)" stroke="#b45309" stroke-width="3" stroke-linejoin="round" />
    <!-- Nostril -->
    <ellipse cx="478" cy="108" rx="4" ry="1.8" transform="rotate(6 478 108)" fill="#78350f" />

    <!-- Eye Patch & Expressive Eye -->
    <circle cx="438" cy="108" r="13" fill="#fef08a" opacity="0.8" />
    <circle cx="438" cy="108" r="9" fill="#ffffff" stroke="#334155" stroke-width="2.5" />
    <circle cx="441" cy="108" r="4.5" fill="#0f172a" />
    <circle cx="439" cy="105" r="2" fill="#ffffff" />
    <!-- Determined Happy Eyebrow -->
    <path d="M 426 95 Q 439 90 450 97" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" />

    <!-- Jaunty Striped Cycling Cap -->
    <path d="M 404 95 C 408 72 445 70 454 92 Z" fill="#0284c7" stroke="#0369a1" stroke-width="2.5" />
    <path d="M 426 76 L 432 93" stroke="#facc15" stroke-width="4" />
    <path d="M 448 90 L 472 92 C 474 96 465 99 450 96 Z" fill="#0369a1" />
    <circle cx="428" cy="75" r="4" fill="#facc15" />
  </g>

  <!-- ================= NEAR LEG & PEDAL (Foreground) ================= -->
  <g id="near-leg">
    <!-- Front Crank Arm from (390,430) to Upper Pedal (420,385) -->
    <line x1="390" y1="430" x2="420" y2="385" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <!-- Feathered Thigh from Hip (355,302) to Bent Knee (422,320) -->
    <path d="M 345 295 Q 385 298 422 320" fill="none" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" />
    <path d="M 345 295 Q 385 298 422 320" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <!-- Orange Lower Leg from Knee (422,320) to Upper Pedal (420,382) -->
    <line x1="422" y1="320" x2="420" y2="382" stroke="url(#legGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="422" cy="320" r="7.5" fill="#fb923c" />
    <!-- Webbed Foot Pressing the Pedal -->
    <path d="M 410 382 L 456 385 C 458 374 442 368 420 375 Z" fill="url(#legGrad)" stroke="#c2410c" stroke-width="2" stroke-linejoin="round" />
    <line x1="422" y1="378" x2="446" y2="380" stroke="#fed7aa" stroke-width="1.5" />
    <!-- Foreground Pedal -->
    <rect x="404" y="383" width="38" height="9" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <rect x="413" y="385" width="20" height="4" rx="2" fill="#f59e0b" />
  </g>

  <!-- ================= FOREGROUND WING & HANDLEBAR GRIP ================= -->
  <!-- Brass Bell & Rubber Grip -->
  <circle cx="458" cy="220" r="8" fill="#fbbf24" stroke="#b45309" stroke-width="2" />
  <rect x="420" y="231" width="26" height="11" rx="5" transform="rotate(-12 433 236)" fill="#1e293b" />

  <!-- Pelican Wing Reaching to Hold Handlebar -->
  <g id="wing" filter="url(#softShadow)">
    <!-- Dark Slate Primary Feather Tips (Classic White Pelican Wing Coloring) -->
    <path d="M 380 268 C 415 272 442 256 448 242 C 452 232 438 225 426 230 C 405 236 380 245 360 250 Z" fill="#334155" stroke="#1e293b" stroke-width="2.5" />
    <!-- Main White Wing Reaching Forward -->
    <path d="M 318 242 C 345 225 395 225 434 235 C 442 238 442 248 430 250 C 415 253 428 260 416 263 C 400 266 408 273 392 274 C 355 276 322 270 308 258 C 302 252 308 246 318 242 Z" fill="url(#wingGrad)" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" />
    <!-- Wing Covert Feather Detail Lines -->
    <path d="M 332 250 Q 368 252 398 245" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 340 261 Q 370 263 392 257" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
